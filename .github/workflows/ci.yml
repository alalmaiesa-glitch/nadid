      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: |
          for attempt in 1 2 3 4; do
            if supabase start; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Supabase start failed after 4 attempts."
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Rebuild local database from migrations
        run: supabase db reset --local

      - name: Run PostgreSQL fault injection V1
        env:
          PGPASSWORD: postgres
        run: >-
          psql
          "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -f supabase/tests/worker_persistence_fault_injection.sql


name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run AEE tests
        env:
          PYTHONPATH: .
        run: pytest -q


  quality-benchmark:
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile private quality harnesses
        run: >-
          python -m py_compile
          benchmark/run_corpus_regression.py
          benchmark/run_silver_set.py
          benchmark/run_mutation_benchmark.py
          benchmark/run_consistency_benchmark.py
          benchmark/run_evidence_benchmark.py
          benchmark/run_confidence_benchmark.py
          benchmark/run_action_policy_benchmark.py
          benchmark/run_review_loop_benchmark.py
          benchmark/build_gold_sample.py
          benchmark/evaluate_gold.py
          benchmark/review_gold_cli.py
          benchmark/compare_gold_reviews.py

      - name: Verify Gold Set evaluator fixture
        run: >-
          python benchmark/evaluate_gold.py
          --gold benchmark/gold/example_adjudicated_v1.json
          --report /tmp/gold-example-report.json
          --require-complete

      - name: Run Nadid Quality Benchmark
        env:
          PYTHONPATH: backend
        run: python benchmark/run_benchmark.py --report benchmark/report.json --enforce-critical

      - name: Run Mutation Benchmark V1
        env:
          PYTHONPATH: backend
        run: >-
          python benchmark/run_mutation_benchmark.py
          --report benchmark/mutation-report.json
          --enforce

      - name: Run Consistency Benchmark V1
        env:
          PYTHONPATH: backend
        run: >-
          python benchmark/run_consistency_benchmark.py
          --report benchmark/consistency-report.json
          --enforce

      - name: Run Evidence Benchmark V1
        env:
          PYTHONPATH: backend
        run: >-
          python benchmark/run_evidence_benchmark.py
          --report benchmark/evidence-report.json
          --enforce

      - name: Run Confidence & Severity Benchmark V1
        env:
          PYTHONPATH: backend
        run: >-
          python benchmark/run_confidence_benchmark.py
          --report benchmark/confidence-report.json
          --enforce

      - name: Run Review Action & Auto-Apply Benchmark V1
        env:
          PYTHONPATH: backend
        run: >-
          python benchmark/run_action_policy_benchmark.py
          --report benchmark/action-policy-report.json
          --enforce

      - name: Run Review Loop & Idempotence V1
        env:
          PYTHONPATH: backend
        run: >-
          python benchmark/run_review_loop_benchmark.py
          --report benchmark/review-loop-report.json
          --enforce

      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        with:
          name: nadid-quality-reports
          path: |
            benchmark/report.json
            benchmark/mutation-report.json
            benchmark/consistency-report.json
            benchmark/evidence-report.json
            benchmark/confidence-report.json
            benchmark/action-policy-report.json
            benchmark/review-loop-report.json


  aee-container:
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AEE image
        run: docker build -t nadid-aee:ci ./backend

      - name: Start AEE container
        run: >-
          docker run -d --rm
          --name nadid-aee-ci
          -e AEE_INTERNAL_TOKEN=ci-internal-token
          -p 8000:8000
          nadid-aee:ci

      - name: Verify health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs nadid-aee-ci
          exit 1

      - name: Concurrent AEE smoke test
        run: |
          docker exec -i nadid-aee-ci python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from io import BytesIO

          import httpx
          from docx import Document

          document = Document()
          document.add_heading("اختبار التحمل المصغر", level=1)
          for index in range(40):
              document.add_paragraph(
                  f"فقرة رقم {index} لاختبار المعالجة المتزامنة في نضيد."
              )

          stream = BytesIO()
          document.save(stream)
          payload = stream.getvalue()

          def analyze(_):
              response = httpx.post(
                  "http://127.0.0.1:8000/v1/analyze/docx",
                  headers={
                      "Authorization": "Bearer ci-internal-token"
                  },
                  files={
                      "file": (
                          "load-smoke.docx",
                          payload,
                          "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                      )
                  },
                  timeout=30,
              )
              return response.status_code

          with ThreadPoolExecutor(max_workers=4) as pool:
              statuses = list(pool.map(analyze, range(8)))

          assert statuses == [200] * 8, statuses
          print("AEE concurrent smoke passed:", statuses)
          PY

      - name: Stop container
        if: always()
        run: docker stop nadid-aee-ci || true


  worker-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate worker syntax
        run: node --check worker/index.mjs

      - name: Build worker image
        run: docker build -t nadid-worker:ci -f worker/Dockerfile .


  web-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://jcyfhfpulckpsdaiecoe.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          --build-arg NEXT_PUBLIC_APP_URL=http://localhost:8080
          -t nadid-web:ci
          .

      - name: Start web container
        run: >-
          docker run -d --rm
          --name nadid-web-ci
          -p 8080:8080
          -e NEXT_PUBLIC_SUPABASE_URL=https://jcyfhfpulckpsdaiecoe.supabase.co
          -e NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          -e SUPABASE_SERVICE_ROLE_KEY=ci-placeholder
          -e AEE_BACKEND_URL=http://127.0.0.1:9999
          -e AEE_INTERNAL_TOKEN=ci-placeholder
          nadid-web:ci

      - name: Verify public homepage
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs nadid-web-ci
          exit 1

      - name: Stop web container
        if: always()
        run: docker stop nadid-web-ci || true

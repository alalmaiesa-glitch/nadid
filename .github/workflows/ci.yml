name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run AEE tests
        env:
          PYTHONPATH: .
        run: pytest -q

  aee-container:
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AEE image
        run: docker build -t nadid-aee:ci ./backend

      - name: Start AEE container
        run: docker run -d --rm --name nadid-aee-ci -p 8000:8000 nadid-aee:ci

      - name: Verify health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs nadid-aee-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop nadid-aee-ci || true


  worker-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate worker syntax
        run: node --check worker/index.mjs

      - name: Build worker image
        run: docker build -t nadid-worker:ci -f worker/Dockerfile .

# EIMDADAT security baseline. Read-only scan; does not expose or upload raw credentials.
name: EIMDADAT Secret Scan
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Detect exposed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked credential filenames
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8", "surrogateescape").split("\0")
          found = []
          for path in filter(None, files):
              basename = pathlib.PurePosixPath(path).name.lower()
              env_file = (basename == ".env" or basename.startswith(".env.")) and basename not in {".env.example", ".env.sample", ".env.template"}
              key_file = basename in {"credentials.json", "id_rsa", "id_ed25519", ".npmrc.local", ".pypirc", ".netrc"} or basename.endswith((".pem", ".p12", ".pfx", ".jks", ".keystore")) or basename.startswith("service-account") and basename.endswith(".json")
              if env_file or key_file:
                  found.append(path)
          if found:
              print("Tracked secret-like filenames (values withheld):")
              for path in found:
                  print("  - " + path)
              sys.exit(1)
          print("Tracked credential filename check passed.")
          PY
      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

  full-history-audit:
    name: Audit full reachable Git history
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[full-history]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Fetch full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all Git refs (no finding values in logs)
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only --tmpfs /tmp \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --log-opts="--all" /repo > /tmp/eimdadat-history-scan.log 2>&1
          rc=$?
          set -e
          rm -f /tmp/eimdadat-history-scan.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::Full-history audit needs private review; details are intentionally withheld."
            exit 1
          fi
          echo "Full reachable Git history scan passed."

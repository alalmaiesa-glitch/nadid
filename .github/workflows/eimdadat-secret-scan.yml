# EIMDADAT security baseline. Read-only scan; does not expose or upload raw credentials.
name: EIMDADAT Secret Scan
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Detect exposed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked credential filenames
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8", "surrogateescape").split("\0")
          found = []
          for path in filter(None, files):
              basename = pathlib.PurePosixPath(path).name.lower()
              env_file = (basename == ".env" or basename.startswith(".env.")) and basename not in {".env.example", ".env.sample", ".env.template"}
              key_file = basename in {"credentials.json", "id_rsa", "id_ed25519", ".npmrc.local", ".pypirc", ".netrc"} or basename.endswith((".pem", ".p12", ".pfx", ".jks", ".keystore")) or basename.startswith("service-account") and basename.endswith(".json")
              if env_file or key_file:
                  found.append(path)
          if found:
              print("Tracked secret-like filenames (values withheld):")
              for path in found:
                  print("  - " + path)
              sys.exit(1)
          print("Tracked credential filename check passed.")
          PY
      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
